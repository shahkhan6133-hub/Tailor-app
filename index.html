<script>
const STORE_KEY='tailorpro_data_v1';
const defaultData={settings:{shopName:'My Tailor Shop',phone:'',address:'',currency:'PKR',owner:''},customers:[],orders:[],transactions:[],nextOrder:1001};
let db=loadData(), currentPage='dashboard';
function loadData(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));return d?{...defaultData,...d,settings:{...defaultData.settings,...(d.settings||{})}}:structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
function saveData(){localStorage.setItem(STORE_KEY,JSON.stringify(db));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(Number(n)||0)}
function dateNow(){return new Date().toISOString().slice(0,10)}
function niceDate(s){if(!s)return '—';let d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function statusClass(s){return {'New':'status-new','Cutting':'status-cutting','Stitching':'status-stitching','Ready':'status-ready','Delivered':'status-delivered'}[s]||'status-new'}
function statusBadge(s){return `<span class="status ${statusClass(s)}">${esc(s||'New')}</span>`}
function customer(id){return db.customers.find(c=>c.id===id)}
function orderBalance(o){return Math.max(0,(+o.total||0)-paidForOrder(o.id))}
function paidForOrder(id){return db.transactions.filter(t=>t.orderId===id&&t.type==='payment').reduce((s,t)=>s+(+t.amount||0),0)}
function orderTotal(o){return (+o.qty||0)*(+o.rate||0)}
function allIncome(){return db.transactions.filter(t=>t.type==='payment').reduce((s,t)=>s+(+t.amount||0),0)}
function allExpenses(){return db.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+(+t.amount||0),0)}
function toast(msg){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2800)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').classList.toggle('show')}
function navigate(page){currentPage=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('topTitle').textContent=({dashboard:'Dashboard',orders:'Order Management',customers:'Customers',measurements:'Measurements',accounts:'Accounts & Transactions',reports:'Reports',settings:'Settings & Backup'})[page]||page;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');renderPage()}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function renderPage(){document.getElementById('brandName').textContent=db.settings.shopName||'TailorPro';document.getElementById('navOrderCount').textContent=db.orders.filter(o=>o.status!=='Delivered').length||'';const c=document.getElementById('content');({dashboard:renderDashboard,orders:renderOrders,customers:renderCustomers,measurements:renderMeasurements,accounts:renderAccounts,reports:renderReports,settings:renderSettings}[currentPage]||renderDashboard)();}

 const q=(document.getElementById('orderSearch')?.value||'').toLowerCase(), filter=document.getElementById('statusFilter')?.value||'';

>`;

function refreshOrders(){const s=document.getElementById('orderSearch')?.value||'',f=document.getElementById('statusFilter')?.value||'';renderOrders();document.getElementById('orderSearch').value=s;document.getElementById('statusFilter').value=f;document.getElementById('orderSearch').focus();document.getElementById('orderSearch').setSelectionRange(s.length,s.length)}

function renderCustomers(){

function renderMeasurements(){document.getElementById('content').innerHTML=`<div class="page-head"><div><h3>Measurements</h3><p>Keep each customer's measurements ready for the next order.</p></div><button class="btn btn-primary" onclick="openCustomerModal()">＋ Add Customer</button></div><section class="panel"><div class="panel-head"><h4>Saved Measurements</h4><span class="muted" style="font-size:12px">${db.customers.filter(c=>c.measurements&&Object.values(c.measurements).some(Boolean)).length} customers with measurements</span></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Qameez</th><th>Shoulder</th><th>Sleeve</th><th>Chest</th><th>Shalwar</th><th>Notes</th><th>Action</th></tr></thead><tbody>${db.customers.length?db.customers.map(c=>{let m=c.measurements||{};return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(m.shirtLength||'—')}</td><td>${esc(m.shoulder||'—')}</td><td>${esc(m.sleeve||'—')}</td><td>${esc(m.chest||'—')}</td><td>${esc(m.shalwarLength||'—')}</td><td>${esc(m.notes||'—')}</td><td><button class="btn btn-light btn-small" onclick="openCustomerModal('${c.id}',true)">Edit sizes</button></td></tr>`}).join(''):`<tr><td colspan="9"><div class="empty">Add customers to save their measurements.</div></td></tr>`}</tbody></table></div></section><div class="notice">Measurement units (inches, centimetres, etc.) are entered by you. Use the same unit consistently for each customer.</div>`}

function renderAccounts(){
 const q=(document.getElementById('txSearch')?.value||'').toLowerCase();const type=document.getElementById('txFilter')?.value||'';const list=[...db.transactions].filter(t=>(!type||t.type===type)&&`${t.description||''} ${t.date||''} ${t.type}`.toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

.id===t.orderId)?.number||''):'—'}</td><td>${esc(t.method||'Cash')}</td><td class="money">${money(t.amount)}</td><td><button class="btn btn-danger btn-small" onclick="deleteTransaction('${t.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No transactions recorded yet.</div></td></tr>`}</tbody></table></div></section><div class="notice">When recording a payment against an order, the payment is linked to that order and reduces its balance automatically. Do not record the same advance twice.</div>`;
}
function refreshTransactions(){let q=document.getElementById('txSearch').value,t=document.getElementById('txFilter').value;renderAccounts();document.getElementById('txSearch').value=q;document.getElementById('txFilter').value=t;document.getElementById('txSearch').focus();document.getElementById('txSearch').setSelectionRange(q.length,q.length)}
function renderReports(){let delivered=db.orders.filter(o=>o.status==='Delivered').length, active=db.orders.length-delivered, due=db.orders.reduce((s,o)=>s+orderBalance(o),0);let month=dateNow().slice(0,7),monthIncome=db.transactions.filter(t=>t.type==='payment'&&t.date?.startsWith(month)).reduce((s,t)=>s+(+t.amount||0),0),monthExpense=db.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(month)).reduce((s,t)=>s+(+t.amount||0),0);
document.getElementById('content').innerHTML=`<div class="page-head"><div><h3>Business Reports</h3><p>A quick view of orders, collections and balances.</p></div><button class="btn btn-light" onclick="window.print()">🖨 Print report</button></div><div class="stats"><div class="stat"><div class="stat-top">Total orders</div><strong>${db.orders.length}</strong><small>${active} active · ${delivered} delivered</small></div><div class="stat"><div class="stat-top">This month's payments</div><strong>${money(monthIncome)}</strong><small>${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}</small></div><div class="stat"><div class="stat-top">This month's expenses</div><strong>${money(monthExpense)}</strong><small>Recorded expenses</small></div><div class="stat"><div class="stat-top">Total outstanding</div><strong>${money(due)}</strong><small>Unpaid across all orders</small></div></div><div class="grid-2"><section class="panel"><div class="panel-head"><h4>Order Status Summary</h4></div><div class="panel-body">${['New','Cutting','Stitching','Ready','Delivered'].map(s=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6;padding:9px 0"><span>${statusBadge(s)}</span><b>${db.orders.filter(o=>o.status===s).length}</b></p>`).join('')}</div></section><section class="panel"><div class="panel-head"><h4>Financial Summary</h4></div><div class="panel-body"><p style="display:flex;justify-content:space-between"><span class="muted">All payments received</span><b>${money(allIncome())}</b></p><p style="display:flex;justify-content:space-between"><span class="muted">All expenses</span><b>${money(allExpenses())}</b></p><p style="display:flex;justify-content:space-between"><span class="muted">Net cash flow</span><b>${money(allIncome()-allExpenses())}</b></p><p style="display:flex;justify-content:space-between"><span class="muted">Outstanding balance</span><b>${money(due)}</b></p><div class="notice">Reports include only records entered into this software. Export your data backup regularly.</div></div></section></div><section class="panel"><div class="panel-head"><h4>Customer Balances</h4><button class="btn btn-light btn-small" onclick="navigate('customers')">View customers</button></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Outstanding</th></tr></thead><tbody>${db.customers.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td>${os.length}</td><td>${money(os.reduce((s,o)=>s+orderBalance(o),0))}</td></tr>`}).join('')||'<tr><td colspan="4"><div class="empty">No customers to report.</div></td></tr>'}</tbody></table></div></section>`}
function renderSettings(){document.getElementById('content').innerHTML=`<div class="page-head"><div><h3>Settings & Backup</h3><p>Personalize your shop and protect your business records.</p></div></div><div class="settings-grid"><section class="setting-card"><h4>🏪 Shop Details</h4><form id="settingsForm" onsubmit="saveSettings(event)"><div style="margin-bottom:13px"><label>Shop name</label><input name="shopName" required value="${esc(db.settings.shopName)}"></div><div style="margin-bottom:13px"><label>Phone number</label><input name="phone" value="${esc(db.settings.phone)}" placeholder="03xx-xxxxxxx"></div><div style="margin-bottom:13px"><label>Shop address</label><textarea name="address" rows="2">${esc(db.settings.address)}</textarea></div><div style="margin-bottom:13px"><label>Owner name (optional)</label><input name="owner" value="${esc(db.settings.owner)}"></div><button class="btn btn-primary" type="submit">Save Settings</button></form></section><section class="setting-card"><h4>💾 Data Backup</h4><p class="muted" style="font-size:13px;line-height:1.6">Download a JSON backup of your customers, measurements, orders and transactions. Keep it somewhere safe. Use Restore to load a previous backup.</p><button class="btn btn-primary" onclick="exportBackup()">⬇ Export Backup</button> <label class="btn btn-light" style="display:inline-flex;margin:0;cursor:pointer">⬆ Restore Backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"></label><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h4>🧹 Data Management</h4><p class="muted" style="font-size:12px">Clear all local records only if you are sure. This cannot be undone unless you have a backup.</p><button class="btn btn-danger" onclick="clearData()">Clear All Records</button></section></div><section class="panel" style="margin-top:18px"><div class="panel-head"><h4>About this version</h4></div><div class="panel-body"><p style="font-size:13px;line-height:1.7">TailorPro is a starter offline web app. Data is stored in this browser on this device. It does not automatically sync between a computer and mobile phone. For multi-device sharing, a secure online database/server is needed.</p><div class="notice">Recommended: export a backup after entering important orders. Clearing browser data or changing browsers may remove locally saved records.</div></div></section>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.settings={shopName:f.get('shopName').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),owner:f.get('owner').trim(),currency:'PKR'};saveData();renderPage();toast('Shop settings saved.')}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tailorpro-backup-${dateNow()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup exported.')}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.customers||!x.orders||!x.transactions)throw new Error('Invalid backup');if(confirm('Restore this backup? Current records will be replaced.')){db={...defaultData,...x,settings:{...defaultData.settings,...(x.settings||{})}};saveData();renderPage();toast('Backup restored.')}}catch(err){alert('This file is not a valid TailorPro backup.')}e.target.value=''};r.readAsText(file)}
function clearData(){if(confirm('Delete ALL customers, orders and transactions from this browser?')){if(confirm('Last check: this cannot be undone without a backup. Continue?')){db={...structuredClone(defaultData),settings:{...db.settings}};saveData();renderPage();toast('Local records cleared.')}}}

function modal(title,body,wide=false){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" ${wide?'style="width:min(900px,100%)"':''}><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openCustomerModal(id=null,focusMeasurements=false){const c=id?customer(id):null,m=c?.measurements||{};modal(c?'Edit Customer':'Add Customer',`<form id="customerForm" onsubmit="saveCustomer(event,'${id||''}')"><div class="form-grid"><div><label>Customer name *</label><input name="name" required value="${esc(c?.name||'')}"></div><div><label>Mobile number</label><input name="phone" value="${esc(c?.phone||'')}" placeholder="03xx-xxxxxxx"></div><div class="full"><label>Address (optional)</label><input name="address" value="${esc(c?.address||'')}"></div><div class="full"><h4 style="margin:5px 0 0">📏 Measurements <span class="muted" style="font-size:11px;font-weight:400">(Use one unit consistently)</span></h4></div>${measurementFields.map(([key,label])=>`<div ${key==='notes'?'class="full"':''}><label>${label}</label>${key==='notes'?`<textarea name="m_${key}" rows="2">${esc(m[key]||'')}</textarea>`:`<input name="m_${key}" value="${esc(m[key]||'')}" placeholder="Enter measurement">`}</div>`).join('')}</div><div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save Customer</button></div></form>`,true)}
function saveCustomer(e,id){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();let m={};measurementFields.forEach(([k])=>m[k]=String(f.get('m_'+k)||'').trim());if(id){let c=customer(id);Object.assign(c,{name,phone:String(f.get('phone')||'').trim(),address:String(f.get('address')||'').trim(),measurements:m})}else{db.customers.push({id:crypto.randomUUID(),name,phone:String(f.get('phone')||'').trim(),address:String(f.get('address')||'').trim(),measurements:m,createdAt:new Date().toISOString()})}saveData();closeModal();renderPage();toast(id?'Customer updated.':'Customer added.')}
function openOrderModal(orderId=null,preCustomerId=''){const o=orderId?db.orders.find(x=>x.id===orderId):null;const selected=o?.customerId||preCustomerId;const c=customer(selected);const statuses=['New','Cutting','Stitching','Ready','Delivered'];modal(o?'Edit Order':'Create New Order',`<form id="orderForm" onsubmit="saveOrder(event,'${orderId||''}')"><div class="form-grid"><div><label>Customer *</label><select name="customerId" required onchange="showCustomerMeasurements(this.value)"><option value="">Select customer</option>${db.customers.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('')}</select><small class="muted">Need a new customer? <a href="#" onclick="event.preventDefault();openCustomerModal()">Add customer</a></small></div><div><label>Clothing type</label><select name="item">${['Shalwar Kameez','Waistcoat','Shirt','Trouser','Other'].map(x=>`<option ${o?.item===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Quantity (suits/items) *</label><input name="qty" type="number" min="1" required value="${o?.qty||1}" oninput="calcOrderPreview()"></div><div><label>Stitching rate per item (PKR) *</label><input name="rate" type="number" min="0" step="1" required value="${o?.rate||''}" oninput="calcOrderPreview()"></div><div><label>Order date *</label><input name="orderDate" type="date" required value="${o?.orderDate||dateNow()}"></div><div><label>Delivery date *</label><input name="deliveryDate" type="date" required value="${o?.deliveryDate||dateNow()}"></div><div><label>Initial payment / advance (PKR)</label><input name="advance" type="number" min="0" step="1" value="${o?paidForOrder(o.id):0}" ${o?'readonly':''}><small class="muted">${o?'Add later payments in Accounts.':'This payment is recorded as a transaction.'}</small></div><div><label>Order status</label><select name="status">${statuses.map(s=>`<option ${o?.status===s?'selected':(!o&&s==='New')?'selected':''}>${s}</option>`).join('')}</select></div><div class="full"><label>Special instructions</label><textarea name="notes" rows="2" placeholder="Fabric, style, fitting, pocket details…">${esc(o?.notes||'')}</textarea></div><div class="full" id="measurementHint">${c?measurementHint(c):'<div class="notice">Choose a customer to view their saved measurements.</div>'}</div><div class="full notice" id="orderPreview">Order total: ${money(o?.total||0)}</div></div><div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">${o?'Save Changes':'Create Order'}</button></div></form>`,true)}
function measurementHint(c){let m=c?.measurements||{};let entries=measurementFields.filter(([k])=>k!=='notes'&&m[k]).map(([k,l])=>`${l}: ${m[k]}`);return `<div class="notice"><b>Saved measurements:</b> ${entries.length?entries.map(esc).join(' · '):'No measurements saved yet.'}</div>`}
function showCustomerMeasurements(id){document.getElementById('measurementHint').innerHTML=measurementHint(customer(id));}
function calcOrderPreview(){let f=document.getElementById('orderForm');if(!f)return;let qty=+f.elements.qty.value||0,rate=+f.elements.rate.value||0,adv=+f.elements.advance.value||0,total=qty*rate;document.getElementById('orderPreview').textContent=`Order total: ${money(total)}  |  Advance: ${money(adv)}  |  Balance after advance: ${money(Math.max(0,total-adv))}`}
function saveOrder(e,id){e.preventDefault();const f=new FormData(e.target),customerId=f.get('customerId');if(!customerId){alert('Please select a customer.');return}const qty=+f.get('qty'),rate=+f.get('rate'),total=qty*rate,advance=+f.get('advance')||0;if(advance>total){alert('Advance cannot be greater than the order total.');return}if(id){let o=db.orders.find(x=>x.id===id);Object.assign(o,{customerId,item:f.get('item'),qty,rate,total,orderDate:f.get('orderDate'),deliveryDate:f.get('deliveryDate'),status:f.get('status'),notes:f.get('notes')});}else{const o={id:crypto.randomUUID(),number:db.nextOrder++,customerId,item:f.get('item'),qty,rate,total,orderDate:f.get('orderDate'),deliveryDate:f.get('deliveryDate'),status:f.get('status'),notes:f.get('notes'),createdAt:new Date().toISOString()};db.orders.push(o);if(advance>0)db.transactions.push({id:crypto.randomUUID(),type:'payment',date:dateNow(),amount:advance,description:'Advance for order #'+o.number,orderId:o.id,method:'Cash'});}saveData();closeModal();renderPage();toast(id?'Order updated.':'Order created successfully.')}
function editOrder(id){openOrderModal(id)}
function changeStatus(id,status){let o=db.orders.find(x=>x.id===id);if(o){o.status=status;if(status==='Delivered')o.deliveredDate=dateNow();saveData();renderPage();toast('Order status updated.')}}

function openTransactionModal(type='payment'){const isPay=type==='payment';modal(isPay?'Record Customer Payment':'Record Shop Expense',`<form onsubmit="saveTransaction(event,'${type}')"><div class="form-grid"><div><label>Date *</label><input name="date" type="date" required value="${dateNow()}"></div><div><label>Amount (PKR) *</label><input name="amount" type="number" min="1" required></div>${isPay?`<div class="full"><label>Link to order (optional)</label><select name="orderId"><option value="">Not linked to an order</option>${db.orders.filter(o=>orderBalance(o)>0).map(o=>`<option value="${o.id}">#${o.number} — ${esc(customer(o.customerId)?.name||'Customer')} — Due ${money(orderBalance(o))}</option>`).join('')}</select></div>`:''}<div><label>Payment method</label><select name="method"><option>Cash</option><option>Bank transfer</option><option>Mobile wallet</option><option>Other</option></select></div><div><label>Description</label><input name="description" placeholder="${isPay?'Payment / installment':'Fabric, rent, electricity…'}"></div></div><div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save ${isPay?'Payment':'Expense'}</button></div></form>`)}
function saveTransaction(e,type){e.preventDefault();let f=new FormData(e.target),amount=+f.get('amount'),orderId=f.get('orderId')||'';if(type==='payment'&&orderId){const due=orderBalance(db.orders.find(o=>o.id===orderId));if(amount>due){if(!confirm(`This payment is greater than the current balance (${money(due)}). Record it anyway?`))return}}db.transactions.push({id:crypto.randomUUID(),type,date:f.get('date'),amount,orderId,method:f.get('method'),description:String(f.get('description')||'').trim()||(type==='payment'?'Customer payment':'Shop expense')});saveData();closeModal();renderPage();toast(type==='payment'?'Payment recorded.':'Expense recorded.')}
function deleteTransaction(id){if(confirm('Delete this transaction? The order balance may change.')){db.transactions=db.transactions.filter(t=>t.id!==id);saveData();renderPage();toast('Transaction deleted.')}}
function showReceipt(id){const o=db.orders.find(x=>x.id===id),c=customer(o.customerId)||{};const paid=paidForOrder(id);modal('Order Receipt',`<div class="receipt" id="receiptPrint"><h2>${esc(db.settings.shopName||'My Tailor Shop')}</h2><p>${esc(db.settings.phone||'')}${db.settings.address?' · '+esc(db.settings.address):''}</p><hr><h3 style="text-align:center">ORDER RECEIPT</h3><p><b>Order #:</b> ${esc(o.number)} &nbsp; <b>Date:</b> ${niceDate(o.orderDate)}</p><p><b>Customer:</b> ${esc(c.name||'')} &nbsp; <b>Phone:</b> ${esc(c.phone||'—')}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody><tr><td>${esc(o.item)}</td><td>${o.qty}</td><td>${money(o.rate)}</td><td>${money(o.total)}</td></tr></tbody></table><p style="text-align:right"><b>Total:</b> ${money(o.total)}<br><b>Paid:</b> ${money(paid)}<br><b>Balance:</b> ${money(orderBalance(o))}<br><b>Delivery date:</b> ${niceDate(o.deliveryDate)}<br><b>Status:</b> ${esc(o.status)}</p>${o.notes?`<p style="text-align:left"><b>Instructions:</b> ${esc(o.notes)}</p>`:''}<hr><p>Thank you for your business!</p></div><div class="form-actions no-print"><button class="btn btn-light" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="printReceipt()">🖨 Print Receipt</button></div>`)}
function printReceipt(){const receipt=document.getElementById('receiptPrint');if(!receipt)return;const w=window.open('','_blank','width=700,height=800');w.document.write(`<html lang="${lang==='ur'?'ur':'en'}" dir="${lang==='ur'?'rtl':'ltr'}"><head><meta charset="UTF-8"><title>${lang==='en'?'Tailor Shop Receipt':lang==='ur'?'درزی دکان کی رسید':'Tailor Shop Receipt / درزی دکان کی رسید'}</title><style>body{font-family:Arial,'Noto Naskh Arabic',Tahoma,sans-serif;padding:24px;color:#111}.ur-sub{display:block;direction:rtl;text-align:right}html[dir=rtl] .receipt td,html[dir=rtl] .receipt th{text-align:right}.receipt{max-width:600px;margin:auto}.receipt h2,.receipt p{text-align:center}.receipt table{width:100%;border-collapse:collapse}.receipt td,.receipt th{border:1px solid #ddd;padding:10px;text-align:left}hr{border:0;border-top:1px solid #ccc}</style></head><body>${receipt.outerHTML}<script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close()}

const MON={Jan:'جنوری',Feb:'فروری',Mar:'مارچ',Apr:'اپریل',May:'مئی',Jun:'جون',Jul:'جولائی',Aug:'اگست',Sept:'ستمبر',Sep:'ستمبر',Oct:'اکتوبر',Nov:'نومبر',Dec:'دسمبر'};
const MONL={January:'جنوری',February:'فروری',March:'مارچ',April:'اپریل',May:'مئی',June:'جون',July:'جولائی',August:'اگست',September:'ستمبر',October:'اکتوبر',November:'نومبر',December:'دسمبر'};
const MLAB=['qameez length','shoulder / tira','sleeve','chest','waist','ghera / hip','neck','cuff','shalwar length','paancha','shalwar ghera','pockets'];
function patternUr(t){let m;
 if(m=t.match(/^(\d{2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec) (\d{4})$/))return{ur:`${m[1]} ${MON[m[2]]} ${m[3]}`,only:1};
 if(m=t.match(/^(January|February|March|April|May|June|July|August|September|October|November|December) (\d{4})$/))return{ur:`${MONL[m[1]]} ${m[2]}`,only:1};
 if(m=t.match(/^(\d+) ready for delivery$/))return{ur:`${m[1]} ڈیلیوری کے لیے تیار`};
 if(m=t.match(/^(\d+) customers with measurements$/))return{ur:`${m[1]} گاہکوں کی ناپ محفوظ ہے`};
 if(m=t.match(/^(\d+) active · (\d+) delivered$/))return{ur:`${m[1]} جاری · ${m[2]} ڈیلیور شدہ`};
 if(m=t.match(/^(Shalwar Kameez|Waistcoat|Shirt|Trouser|Other) × (\d+)$/))return{ur:`${UR[m[1].toLowerCase()]} × ${m[2]}`};
 if(m=t.match(/^Advance for order #(\d+)$/))return{ur:`آرڈر #${m[1]} کے لیے ایڈوانس`};
 if(m=t.match(/^Order total: (.+?)\s*\|\s*Advance: (.+?)\s*\|\s*Balance after advance: (.+)$/))return{ur:`کل آرڈر: ${m[1]} | ایڈوانس: ${m[2]} | ایڈوانس کے بعد بقایا: ${m[3]}`};
 if(m=t.match(/^Order total: (.+)$/))return{ur:`کل آرڈر: ${m[1]}`};
 if(m=t.match(/^#(\d+) — (.*) — Due (.+)$/))return{ur:`#${m[1]} — ${m[2]} — بقایا ${m[3]}`};
 if(m=t.match(/^This payment is greater than the current balance \((.+)\)\. Record it anyway\?$/))return{ur:`یہ ادائیگی موجودہ بقایا (${m[1]}) سے زیادہ ہے۔ کیا پھر بھی درج کریں؟`};
 const parts=t.split(' · ');
 if(parts.every(p=>/^[^:]+: .+$/.test(p)&&MLAB.includes(p.split(':')[0].toLowerCase())))return{ur:parts.map(p=>{const i=p.indexOf(':');return UR[p.slice(0,i).toLowerCase()]+':'+p.slice(i+1)}).join(' · ')};
 return null}
function i18n(raw){
 const lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0],t=raw.trim();
 if(!t||t.length>400)return null;
 const p=patternUr(t);
 if(p)return{pre:lead,core:t,suf:trail,ur:p.ur,only:!!p.only};
 const m=t.match(/^([^A-Za-z(]*?)([A-Za-z(][\s\S]*?)((?:[\s*→:]|👋)*)$/u);
 if(!m)return null;
 const ur=UR[m[2].replace(/’/g,"'").toLowerCase()];
 return ur?{pre:lead+m[1],core:m[2],suf:m[3]+trail,ur,only:false}:null}
const I18N_STATE=new WeakMap();let i18nObs=null;
function setLang(l){lang=l;try{localStorage.setItem(LANG_KEY,l)}catch(e){}applyI18n()}
function updateToday(){const el=document.getElementById('todayLabel');if(!el)return;const d=new Date(),o={weekday:'long',day:'numeric',month:'long',year:'numeric'};const en=d.toLocaleDateString('en-US',o);let ur='';try{ur=d.toLocaleDateString('ur-PK',o)}catch(e){}el.textContent=lang==='ur'&&ur?ur:lang==='both'&&ur?en+' / '+ur:en}
function applyI18n(){
 if(i18nObs)i18nObs.disconnect();
 try{
  document.body.classList.toggle('ur',lang==='ur');document.body.classList.toggle('has-ur',lang!=='en');
  document.documentElement.lang=lang==='ur'?'ur':'en';
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  updateToday();
  document.title=lang==='ur'?'ٹیلر پرو — درزی دکان مینجمنٹ':lang==='both'?'TailorPro — Tailor Shop Management / درزی دکان مینجمنٹ':'TailorPro — Tailor Shop Management';
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('script,style,textarea,[data-i18n-skip],.ur-sub'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
   let st=I18N_STATE.get(n);
   if(st&&n.nodeValue!==st.applied){if(st.extra)st.extra.remove();st=null}
   if(!st){st={orig:n.nodeValue,applied:n.nodeValue,extra:null};I18N_STATE.set(n,st)}
   if(st.extra){st.extra.remove();st.extra=null}
   const r=lang==='en'?null:i18n(st.orig),par=n.parentElement;let val=st.orig;
   if(r){
    if(par.tagName==='OPTION'&&!par.hasAttribute('value'))par.setAttribute('value',st.orig.trim());
    if(lang==='ur')val=r.pre+r.ur+r.suf;
    else if(!r.only){
     const long=r.core.length>45&&!/^(OPTION|BUTTON|TH|TD|LABEL|H3|H4|A)$/.test(par.tagName);
     if(long){const s=document.createElement('span');s.className='ur-sub';s.textContent=r.ur;n.after(s);st.extra=s}
     else val=r.pre+r.core+' / '+r.ur+r.suf;
    }
   }
   if(n.nodeValue!==val)n.nodeValue=val;
   st.applied=val;
  });
  document.querySelectorAll('[placeholder]').forEach(el=>{
   if(el.closest('[data-i18n-skip]'))return;
   const cur=el.getAttribute('placeholder');
   if(el.dataset.phApplied!==cur)el.dataset.phEn=cur;
   const en=el.dataset.phEn,r=lang==='en'?null:i18n(en);let v=en;
   if(r)v=lang==='ur'?r.pre+r.ur+r.suf:r.pre+r.core+' / '+r.ur+r.suf;
   el.setAttribute('placeholder',v);el.dataset.phApplied=v;
  });
 }finally{
  if(!i18nObs)i18nObs=new MutationObserver(()=>applyI18n());
  i18nObs.observe(document.body,{childList:true,subtree:true,characterData:true});
 }
}
const _alert=window.alert.bind(window),_confirm=window.confirm.bind(window);
function msgI18n(m){if(lang==='en')return m;const r=i18n(String(m));if(!r)return m;return lang==='ur'?r.ur:m+'\n\n'+r.ur}
window.alert=m=>_alert(msgI18n(m));window.confirm=m=>_confirm(msgI18n(m));
/* ===== END LANGUAGE LAYER ===== */
/* ===== THEME SWITCHER ===== */
const THEME_KEY='tailorpro_theme',THEMES=['blue','emerald','purple','sunset','rose','dark'];
function setTheme(t){if(!THEMES.includes(t))t='blue';document.documentElement.dataset.theme=t;try{localStorage.setItem(THEME_KEY,t)}catch(e){}document.querySelectorAll('#themeDots button').forEach(b=>b.classList.toggle('active',b.dataset.theme===t))}
setTheme((()=>{try{return localStorage.getItem(THEME_KEY)||'blue'}catch(e){return 'blue'}})());


renderPage();
applyI18n();
</script>
